<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 128" width="480" height="128" role="img" aria-label="RevenueIQ logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2346"/><stop offset="1" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/><stop offset=".6" stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#3B82F6" stop-opacity=".55"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- card background so the logo works on light and dark pages -->
  <rect x="0" y="0" width="480" height="128" rx="30" fill="#0B0F1A"/>
  <g transform="translate(2,0)">
    <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#bg)" stroke="url(#ring)" stroke-width="3"/>
    <rect x="24" y="80" width="15" height="26" rx="4" fill="url(#bar)"/>
    <rect x="45" y="66" width="15" height="40" rx="4" fill="url(#bar)"/>
    <rect x="66" y="50" width="15" height="56" rx="4" fill="url(#bar)"/>
    <polyline points="31,74 52,60 73,44" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="73" y1="44" x2="102" y2="24" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/>
    <circle cx="102" cy="24" r="7" fill="#34D399" filter="url(#glow)"/>
    <circle cx="102" cy="24" r="3" fill="#0B0F1A"/>
  </g>
  <text x="148" y="72" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#E8ECF6">Revenue<tspan fill="url(#txt)">IQ</tspan></text>
  <text x="150" y="98" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3.2" fill="#8FA0C0">AI REVENUE FORECASTING</text>
</svg>
